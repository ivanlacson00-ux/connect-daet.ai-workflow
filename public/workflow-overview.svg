<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title description">
  <title id="title">CONNECT-Daet document submission and approval workflow</title>
  <desc id="description">A workflow diagram showing submission, approver review, administrator route finalization, sequential municipal office review, optional requirements requests, rejections, and final administrative completion.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#75849a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3478f6"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#df665d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#21334d" flood-opacity=".08"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #203047; }
      .title { font-size: 34px; font-weight: 750; letter-spacing: -.5px; }
      .subtitle { font-size: 16px; fill: #607087; }
      .eyebrow { font-size: 12px; font-weight: 750; letter-spacing: 1.1px; }
      .stage { font-size: 13px; font-weight: 750; letter-spacing: .7px; }
      .card-title { font-size: 18px; font-weight: 720; }
      .body { font-size: 14px; fill: #54657b; }
      .small { font-size: 12px; fill: #607087; }
      .tiny { font-size: 11px; fill: #607087; }
      .white { fill: #fff; }
      .line { fill: none; stroke: #75849a; stroke-width: 2.2; marker-end: url(#arrow); }
      .blue-line { fill: none; stroke: #3478f6; stroke-width: 2.4; marker-end: url(#arrow-blue); }
      .red-line { fill: none; stroke: #df665d; stroke-width: 2.2; marker-end: url(#arrow-red); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1600" height="1160" fill="#f3f6fb"/>
  <rect x="34" y="28" width="1532" height="1104" rx="24" fill="#fff" stroke="#dce4ef"/>

  <text x="70" y="83" class="eyebrow" fill="#3478f6">CONNECT-DAET.PH  /  WORKFLOW OVERVIEW</text>
  <text x="70" y="126" class="title">Document Submission &amp; Approval</text>
  <text x="70" y="157" class="subtitle">From submitter intake through sequential office review to the administrator’s final decision.</text>

  <g transform="translate(70 182)">
    <rect width="190" height="32" rx="16" fill="#eaf1ff"/><circle cx="17" cy="16" r="5" fill="#3478f6"/>
    <text x="31" y="20" class="small" font-weight="700">Submitter</text>
    <rect x="205" width="190" height="32" rx="16" fill="#fff0eb"/><circle cx="222" cy="16" r="5" fill="#e77755"/>
    <text x="236" y="20" class="small" font-weight="700">Approver</text>
    <rect x="410" width="190" height="32" rx="16" fill="#f0ebff"/><circle cx="427" cy="16" r="5" fill="#8061d8"/>
    <text x="441" y="20" class="small" font-weight="700">Administrator</text>
    <rect x="615" width="245" height="32" rx="16" fill="#e9f7ef"/><circle cx="632" cy="16" r="5" fill="#28a36a"/>
    <text x="646" y="20" class="small" font-weight="700">Municipal offices</text>
    <text x="895" y="20" class="small">Status, audit log, and notifications update as work progresses.</text>
  </g>

  <text x="70" y="257" class="eyebrow" fill="#8290a3">MAIN WORKFLOW</text>
  <g filter="url(#shadow)">
    <rect x="70" y="276" width="250" height="166" rx="16" fill="#f7faff" stroke="#d7e4ff"/>
    <rect x="70" y="276" width="250" height="8" rx="4" fill="#3478f6"/>
    <circle cx="99" cy="316" r="17" fill="#3478f6"/><text x="99" y="322" text-anchor="middle" class="white" font-size="15" font-weight="750">1</text>
    <text x="126" y="322" class="stage" fill="#3478f6">SUBMITTER</text>
    <text x="92" y="359" class="card-title">Create submission</text>
    <text x="92" y="386" class="body">Title, classification, summary</text>
    <text x="92" y="407" class="body">Main document + attachments</text>
    <rect x="92" y="417" width="112" height="19" rx="9" fill="#eaf1ff"/>
    <text x="148" y="431" text-anchor="middle" class="tiny" fill="#3478f6" font-weight="700">Tracking number</text>

    <rect x="375" y="276" width="275" height="166" rx="16" fill="#fff9f6" stroke="#f4d8cb"/>
    <rect x="375" y="276" width="275" height="8" rx="4" fill="#e77755"/>
    <circle cx="404" cy="316" r="17" fill="#e77755"/><text x="404" y="322" text-anchor="middle" class="white" font-size="15" font-weight="750">2</text>
    <text x="431" y="322" class="stage" fill="#c85e3f">APPROVER</text>
    <text x="397" y="359" class="card-title">Review request</text>
    <text x="397" y="386" class="body">Check details and document.</text>
    <text x="397" y="407" class="body">Propose an ordered office route</text>
    <text x="397" y="428" class="body">or reject with a reason.</text>

    <rect x="710" y="276" width="285" height="166" rx="16" fill="#faf8ff" stroke="#e1d8fa"/>
    <rect x="710" y="276" width="285" height="8" rx="4" fill="#8061d8"/>
    <circle cx="739" cy="316" r="17" fill="#8061d8"/><text x="739" y="322" text-anchor="middle" class="white" font-size="15" font-weight="750">3</text>
    <text x="766" y="322" class="stage" fill="#7053c6">ADMINISTRATOR</text>
    <text x="732" y="359" class="card-title">Review proposed route</text>
    <text x="732" y="386" class="body">Revise or finalize the route.</text>
    <text x="732" y="407" class="body">May reject with a reason.</text>
    <text x="732" y="428" class="body">Finalization activates the first step.</text>

    <rect x="1055" y="276" width="260" height="166" rx="16" fill="#f5fbf7" stroke="#cfe9d9"/>
    <rect x="1055" y="276" width="260" height="8" rx="4" fill="#28a36a"/>
    <circle cx="1084" cy="316" r="17" fill="#28a36a"/><text x="1084" y="322" text-anchor="middle" class="white" font-size="15" font-weight="750">4</text>
    <text x="1111" y="322" class="stage" fill="#21885a">OFFICE ROUTE</text>
    <text x="1077" y="359" class="card-title">Review one at a time</text>
    <text x="1077" y="386" class="body">Only the active office decides.</text>
    <text x="1077" y="407" class="body">Approve to advance to the next.</text>
    <text x="1077" y="428" class="body">Mayor is optional and must be last.</text>

    <rect x="1375" y="276" width="150" height="166" rx="16" fill="#faf8ff" stroke="#e1d8fa"/>
    <rect x="1375" y="276" width="150" height="8" rx="4" fill="#8061d8"/>
    <circle cx="1404" cy="316" r="17" fill="#8061d8"/><text x="1404" y="322" text-anchor="middle" class="white" font-size="15" font-weight="750">5</text>
    <text x="1431" y="322" class="stage" fill="#7053c6">ADMIN</text>
    <text x="1393" y="359" class="card-title">Complete</text>
    <text x="1393" y="386" class="body">Final office</text>
    <text x="1393" y="407" class="body">approval returns</text>
    <text x="1393" y="428" class="body">to admin.</text>
  </g>

  <path d="M320 358H365" class="blue-line"/>
  <path d="M650 358H700" class="line"/>
  <path d="M995 358H1045" class="line"/>
  <path d="M1315 358H1365" class="line"/>

  <rect x="70" y="472" width="1460" height="412" rx="18" fill="#fbfcfe" stroke="#dce4ef"/>
  <text x="96" y="507" class="eyebrow" fill="#8290a3">OFFICE ROUTING DETAILS</text>
  <text x="96" y="533" class="small">The administrator finalizes an ordered route using the applicable municipal offices.</text>

  <g filter="url(#shadow)">
    <rect x="112" y="565" width="248" height="100" rx="14" fill="#e9f7ef" stroke="#bfe3ce"/>
    <text x="136" y="596" class="stage" fill="#21885a">ACTIVE ROUTE STEP</text>
    <text x="136" y="624" class="card-title">Assigned office</text>
    <text x="136" y="646" class="small">Treasurer · Sangguniang Bayan · Mayor</text>

    <polygon points="510,555 584,615 510,675 436,615" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="510" y="610" text-anchor="middle" class="stage">OFFICE</text>
    <text x="510" y="629" text-anchor="middle" class="stage">DECISION?</text>

    <rect x="690" y="548" width="235" height="87" rx="14" fill="#f0faf4" stroke="#cfe9d9"/>
    <text x="713" y="578" class="stage" fill="#21885a">APPROVE</text>
    <text x="713" y="604" class="card-title">Advance route</text>
    <text x="713" y="623" class="small">Activate the next office.</text>

    <polygon points="1055,540 1120,592 1055,644 990,592" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1055" y="588" text-anchor="middle" class="stage">ANOTHER</text>
    <text x="1055" y="606" text-anchor="middle" class="stage">OFFICE?</text>

    <rect x="1195" y="536" width="270" height="89" rx="14" fill="#f5fbf7" stroke="#cfe9d9"/>
    <text x="1218" y="566" class="stage" fill="#21885a">YES · ASSIGN NEXT STEP</text>
    <text x="1218" y="592" class="body">Next office reviews the same request.</text>
    <text x="1218" y="612" class="small">Only its assigned office can decide.</text>

    <rect x="1195" y="659" width="270" height="86" rx="14" fill="#faf8ff" stroke="#e1d8fa"/>
    <text x="1218" y="689" class="stage" fill="#7053c6">NO · ROUTE APPROVED</text>
    <text x="1218" y="716" class="card-title">Return to administrator</text>
    <text x="1218" y="736" class="small">Status: pending admin completion</text>

    <rect x="690" y="659" width="235" height="86" rx="14" fill="#fff2f0" stroke="#f0cfca"/>
    <text x="713" y="689" class="stage" fill="#c94f48">REJECT</text>
    <text x="713" y="716" class="card-title">Decline with reason</text>
    <text x="713" y="736" class="small">Submission ends as declined.</text>
  </g>

  <path d="M360 615H426" class="line"/>
  <path d="M584 615H650V591H680" class="line"/>
  <text x="614" y="604" class="tiny" fill="#21885a">Approve</text>
  <path d="M584 615H650V702H680" class="red-line"/>
  <text x="612" y="687" class="tiny" fill="#c94f48">Reject</text>
  <path d="M925 591H978" class="line"/>
  <path d="M1120 592H1185" class="line"/>
  <text x="1140" y="581" class="tiny" fill="#21885a">Yes</text>
  <path d="M1055 644V702H1185" class="line"/>
  <text x="1067" y="674" class="tiny">No</text>
  <path d="M1328 536V516H236V555" class="line"/>
  <text x="747" y="511" text-anchor="middle" class="tiny">Repeat for each office in the finalized route</text>

  <g filter="url(#shadow)">
    <rect x="112" y="775" width="248" height="76" rx="14" fill="#fff8e9" stroke="#f0dfb8"/>
    <text x="136" y="804" class="stage" fill="#9b741b">MORE INFORMATION NEEDED</text>
    <text x="136" y="829" class="body">Office asks submitter to respond.</text>
    <rect x="436" y="775" width="230" height="76" rx="14" fill="#f7faff" stroke="#d7e4ff"/>
    <text x="459" y="804" class="stage" fill="#3478f6">SUBMITTER RESPONDS</text>
    <text x="459" y="829" class="body">May add supporting documents.</text>
    <rect x="690" y="775" width="235" height="76" rx="14" fill="#e9f7ef" stroke="#cfe9d9"/>
    <text x="713" y="804" class="stage" fill="#21885a">RESUME SAME STEP</text>
    <text x="713" y="829" class="body">Returns to the requesting office.</text>
  </g>
  <path d="M510 675V739H236V765" class="line"/>
  <text x="251" y="728" class="tiny">Request requirements</text>
  <path d="M360 813H426" class="blue-line"/>
  <path d="M666 813H680" class="line"/>
  <path d="M808 775V754H236V675" class="line"/>
  <text x="831" y="767" class="tiny">Response received</text>

  <rect x="70" y="910" width="1460" height="184" rx="18" fill="#f8fafc" stroke="#dce4ef"/>
  <text x="98" y="949" class="eyebrow" fill="#8290a3">STATUS &amp; RECORDS THROUGHOUT THE WORKFLOW</text>
  <g>
    <rect x="98" y="972" width="218" height="80" rx="12" fill="#fff" stroke="#e1e7ef"/>
    <text x="118" y="1002" class="stage" fill="#3478f6">TRACKABLE REQUEST</text>
    <text x="118" y="1028" class="small">Submission + tracking number</text>
    <rect x="334" y="972" width="218" height="80" rx="12" fill="#fff" stroke="#e1e7ef"/>
    <text x="354" y="1002" class="stage" fill="#7053c6">VERSIONED ROUTE</text>
    <text x="354" y="1028" class="small">Proposed and finalized steps</text>
    <rect x="570" y="972" width="218" height="80" rx="12" fill="#fff" stroke="#e1e7ef"/>
    <text x="590" y="1002" class="stage" fill="#21885a">OFFICE HISTORY</text>
    <text x="590" y="1028" class="small">Assignment, decision, comments</text>
    <rect x="806" y="972" width="218" height="80" rx="12" fill="#fff" stroke="#e1e7ef"/>
    <text x="826" y="1002" class="stage" fill="#c85e3f">AUDIT LOG</text>
    <text x="826" y="1028" class="small">Actions and status transitions</text>
    <rect x="1042" y="972" width="218" height="80" rx="12" fill="#fff" stroke="#e1e7ef"/>
    <text x="1062" y="1002" class="stage" fill="#3478f6">IN-APP UPDATES</text>
    <text x="1062" y="1028" class="small">Realtime notification changes</text>
    <rect x="1278" y="972" width="220" height="80" rx="12" fill="#fff" stroke="#e1e7ef"/>
    <text x="1298" y="1002" class="stage" fill="#3478f6">EMAIL OUTBOX</text>
    <text x="1298" y="1028" class="small">Queued delivery and retry state</text>
  </g>
  <text x="98" y="1075" class="tiny">Rejections can occur during approver, administrator, or office review. The administrator completes a request only after every finalized route step is approved.</text>
</svg>
